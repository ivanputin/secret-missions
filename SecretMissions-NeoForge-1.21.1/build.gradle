plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.+' }
version = project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = project.neo_version
    runs { client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id } }
    mods { secretmissions { sourceSet sourceSets.main } }
}
repositories { mavenCentral() }
tasks.withType(ProcessResources).configureEach { inputs.properties([mod_version: project.mod_version]); filesMatching('META-INF/neoforge.mods.toml') { expand([mod_version: project.mod_version]) } }
