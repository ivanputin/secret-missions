
name: Build NeoForge mod JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Secret Missions
        working-directory: SecretMissions-NeoForge-1.21.1
        run: gradle --no-daemon build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: SecretMissions-JAR
          path: SecretMissions-NeoForge-1.21.1/build/libs/*.jar
          if-no-files-found: error
